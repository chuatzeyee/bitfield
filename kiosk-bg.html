<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;overflow:hidden;background:#0a0f14}canvas{display:block;width:100vw;height:100vh}</style>
</head>
<body>
<canvas id="board"></canvas>
<script type="module">
import { renderCanvas, PATTERNS } from './js/engine.js';

const canvas = document.getElementById('board');
const doc = {
  width: 1920, height: 1080, cell: 16, seed: 'KIOSK',
  charset: '01', bitSource: 'random', message: 'BITFIELD',
  pattern: 'waves', density: 0.55,
  bg: '#0a0f14', faint: '#1f6f5c', showField: true, font: 'monospace',
};

function resize() {
  doc.width = canvas.width = window.innerWidth;
  doc.height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

let t = 0;
PATTERNS.waves = (x, y, w, h) => 0.5 + 0.5 * Math.sin((x / w) * 10 + (y / h) * 6 + t);

const ctx = canvas.getContext('2d');
let last = performance.now();
function frame(now) {
  t += ((now - last) / 1000) * 0.6;
  last = now;
  renderCanvas(ctx, doc, []);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
